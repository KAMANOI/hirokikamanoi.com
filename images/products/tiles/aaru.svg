  <text x="945" y="150" text-anchor="end" font-family="'Helvetica Neue',Arial,sans-serif" font-size="30" font-weight="600" fill="#5F7E5D">予約 SaaS</text>

  <text x="80" y="400" font-family="'Hiragino Kaku Gothic ProN','Helvetica Neue',sans-serif" font-size="74" font-weight="700" fill="#1C1C1A">サロンの予約を、</text>
  <text x="80" y="488" font-family="'Hiragino Kaku Gothic ProN','Helvetica Neue',sans-serif" font-size="74" font-weight="700" fill="#1C1C1A">LINE1つで完結。</text>
  <text x="82" y="562" font-family="'Hiragino Kaku Gothic ProN','Helvetica Neue',sans-serif" font-size="32" font-weight="400" fill="#6B6B63">お客様はLINEで予約。あなたはスマホで管理。</text>

  <!-- time-slot chips -->
