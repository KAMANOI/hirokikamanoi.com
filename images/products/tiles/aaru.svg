  </g>

  <!-- CTA -->
  <rect x="80" y="812" width="300" height="86" rx="43" fill="#6E8B6E"/>
  <text x="230" y="868" text-anchor="middle" font-family="'Hiragino Kaku Gothic ProN','Helvetica Neue',sans-serif" font-size="36" font-weight="700" fill="#FFFFFF">予約する →</text>

  <text x="80" y="962" font-family="'Hiragino Kaku Gothic ProN','Helvetica Neue',sans-serif" font-size="29" font-weight="500" fill="#5F7E5D">個人・小規模サロンのための予約システム</text>
