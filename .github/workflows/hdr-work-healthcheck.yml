# HDR公式ホームページ（work.html）の死活監視（GitHub Pagesは寝ないためkeepaliveではなく単純な稼働監視）。
# 受注フォームのAPI（ai-virtual-corp側 /api/hdr-work-inquiry）は本番デプロイ後に別途チェックを追加する
# （未デプロイの間はここでチェックすると常に失敗するため、デプロイ完了まで意図的に対象外にしている）。
name: hdr-work-healthcheck

on:
  schedule:
    - cron: '17,47 * * * *'   # 30分おき。ele-keepaliveと分をずらす
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping work.html
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 https://hirokikamanoi.com/work.html || echo 000)
          echo "work.html -> $code"
          test "$code" = "200"
